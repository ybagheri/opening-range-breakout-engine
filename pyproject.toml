[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-engine"
version = "1.4.0"
description = "Opening Range Breakout (ORB) trading engine - Python + MetaTrader5"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1", "mypy>=1.0"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform=='win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408", "RUF059", "DTZ001", "S101", "ARG001", "PLR2004"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
